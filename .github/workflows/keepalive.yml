name: instabox-keepalive

# Réveille la sandbox InstaBox toutes les 10 min pour qu'elle ne se mette pas
# en pause d'inactivité pendant que le grabber Oracle tourne.
# Le GET sur le port publié réveille la machine (302 → /login → 200).
# Un 409 = cooldown après max-run (8 h) : normal, le tick suivant repart.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake the sandbox
        id: wake
        run: |
          URL="https://9119-agqzhj6mp2wxfdq7p7pjbtl6uy.instabox.tech/"
          echo "state=down" >> "$GITHUB_OUTPUT"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -L --max-time 60 -w "%{http_code}" "$URL" || echo "000")
            echo "tentative $i → HTTP $code"
            case "$code" in
              200|302)
                echo "machine debout"
                sed -i 's/^state=.*/state=up/' "$GITHUB_OUTPUT"
                exit 0 ;;
              409)
                echo "cooldown max-run (8 h) — normal, le prochain tick repart"
                sed -i 's/^state=.*/state=cooldown/' "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
            sleep 45
          done
          echo "aucune réponse après 3 essais"

      - name: Alerte Telegram si la sandbox ne répond plus
        if: steps.wake.outputs.state == 'down'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS --max-time 20 -o /dev/null -w "telegram HTTP %{http_code}\n" \
            -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ Keepalive InstaBox : la sandbox ne répond plus (3 essais ratés). Le grabber Oracle est probablement à l'arrêt. Vérifier la machine sur instabox.sh"
